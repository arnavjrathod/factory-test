[project]
name = "todo-api"
version = "1.0.0"
description = "A lightweight task management REST API (FastAPI + SQLite)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.12",  # starlette.testclient deprecates plain httpx (gate runs -W error)
]

[tool.uv]
package = false
